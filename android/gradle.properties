org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 本机的 google() 源不可达, AGP 一旦想自动补装 SDK 组件就会卡在"拉清单"上无限等。
# 关掉自动下载: 缺什么就直接报错, 我们再从镜像手动补。
android.builder.sdkDownload=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# AGP 9 会从 maven 拉 com.android.tools.build:aapt2:<版本>-<build>, 本机 google() 不可达。
# 直接指向 SDK 里 build-tools 36.0.0 自带的 aapt2.exe。路径用正斜杠, Gradle 的
# properties 会把反斜杠当转义。
android.aapt2FromMavenOverride=C:/Users/YiYang/AppData/Local/Android/Sdk/build-tools/36.0.0/aapt2.exe
